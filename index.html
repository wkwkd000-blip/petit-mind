<article class="panel stage"><div class="scene"><div class="sun"></div><div class="ground"></div><div class="sprite" id="sprite">🐣</div></div><div class="speech"><strong id="quoteTitle">몽글이의 한마디</strong><span id="quote">새로운 걸 배우면 마음속에 반짝이는 씨앗이 생겨!</span></div></article>
<div class="section-title"><h3>오늘의 성장 활동</h3><span>활동을 마치면 하루가 쌓여요</span></div><div class="activities" id="activities"></div></section>
<aside class="rightcol"><article class="panel side energy"><h3>마음 에너지</h3><div class="energy-head"><span>컨디션</span><b id="energyText">80 / 100</b></div><div class="track"><div class="fill" id="energyBar"></div></div><div class="actions"><button id="rest" class="primary">☁️ 쉬어가기</button><button id="statsBtn" class="softbtn">📖 나의 기록</button></div><p class="note">휴식하면 컨디션이 5 회복돼요.</p><div class="clockline retro-date">키운 지 <b id="pmDays">1일째</b>　·　<span id="pmAgeLabel">쁘띠</span>의 나이 <b id="pmAge">1세</b><span id="gameDate" hidden></span><span id="nextYear" hidden></span></div></article><article class="panel side"><h3>성장 기록 <span style="color:#92958a;font-size:11px;font-weight:normal" id="dayCount"></span></h3><div class="timeline" id="timeline"></div><button class="reset" id="reset">처음부터 다시 키우기</button></article></aside></div><div class="footer">Petit Mind · 마음의 성장은 저마다 다른 속도로</div></main>
<div class="overlay" id="overlay"><section class="modal"><h2 id="gameTitle"></h2><p class="desc" id="gameDesc"></p><div class="game-area" id="gameArea"></div><div class="result" id="result"></div><div class="modal-foot"><span id="concept"></span><button id="closeGame" class="primary">닫기</button></div></section></div><div class="toast" id="toast"></div>
<script>
const activities=[
{id:'memory',icon:'🧠',name:'기억의 정원',hint:'작업 기억 · 순서대로 기억하기',stat:'int',concept:'작업 기억 · 단기 기억'},
{id:'stroop',icon:'🎨',name:'색깔 탐정',hint:'선택적 주의 · 색 알아맞히기',stat:'int',concept:'억제 제어 · 선택적 주의'},
{id:'pattern',icon:'🔷',name:'다음 모양은?',hint:'규칙 추론 · 패턴 찾기',stat:'int',concept:'유체 지능 · 연쇄 추론'},
{id:'patience',icon:'🍰',name:'달콤한 기다림',hint:'만족 지연 · 참을성 기르기',stat:'virtue',concept:'만족 지연 · 자기 조절'},
{id:'emotion',icon:'💌',name:'마음 신호 읽기',hint:'감정 알아차리기 · 공감하기',stat:'virtue',concept:'정서 인식 · 공감'},
{id:'breathe',icon:'🌬️',name:'마음 챙김 호흡',hint:'호흡 리듬 · 편안해지기',stat:'virtue',concept:'정서 조절 · 스트레스 관리'},
{id:'share',icon:'🤝',name:'간식 나누기',hint:'협력 · 공평한 분배',stat:'social',concept:'조망 수용 · 상호성'},
{id:'rhythm',icon:'🏃',name:'리듬 발걸음',hint:'박자 맞추기 · 몸 움직이기',stat:'body',concept:'시운동 협응 · 반응 시간'}
];
const fresh=()=>({name:'몽글이',age:1,days:0,energy:80,stats:{int:10,virtue:10,social:10,body:10},logs:[],ending:null});let state;
try{state=JSON.parse(localStorage.getItem('petitMindSave'))||fresh()}catch{state=fresh()}
const stages=['유아기','아동기','청소년기','성인'];const faces=['🐣','🐥','🧒','🧑'];const labels={int:'지능',virtue:'인성',social:'사회성',body:'건강'};const icons={int:'💡',virtue:'💚',social:'💬',body:'💪'};
function save(){localStorage.setItem('petitMindSave',JSON.stringify(state));render()}
function render(){document.getElementById('charName').textContent=state.name;let si=Math.min(3,Math.floor((state.age-1)/3));document.getElementById('age').textContent=`${stages[si]} · ${state.age}살`;document.getElementById('sprite').textContent=state.ending?['🌟','🧑‍🎓','🧑‍🎨','🧑‍⚕️'][state.ending.face]:faces[si];document.getElementById('sprite').classList.toggle('sleep',state.energy<20);document.getElementById('mood').textContent=state.ending?`쁘띠의 미래: ${state.ending.job}`:state.energy<25?'조금 지쳤어요. 푹 쉬면 다시 힘이 날 거예요.':`함께한 성장 ${state.days}일째 · 오늘도 한 뼘 자랐어요`;document.getElementById('energyText').textContent=`${state.energy} / 100`;document.getElementById('energyBar').style.width=state.energy+'%';document.getElementById('meters').innerHTML=Object.keys(labels).map(k=>`<div class="meter"><div class="meter-head"><span>${icons[k]} ${labels[k]}</span><b>${state.stats[k]}</b></div><div class="track"><div class="fill" style="width:${state.stats[k]}%"></div></div></div>`).join('');document.getElementById('activities').innerHTML=activities.filter(a=>(state.unlockedGames||['patience']).includes(a.id)).map(a=>`<button class="activity" data-game="${a.id}" ${state.ending?'disabled':''}><span class="emoji">${a.icon}</span><span><b>${a.name}</b><small>${a.hint}</small></span></button>`).join('');document.querySelectorAll('.activity').forEach(b=>b.onclick=()=>startGame(b.dataset.game));document.getElementById('dayCount').textContent=`${state.days}일째`;document.getElementById('timeline').innerHTML=state.logs.length?state.logs.slice(-5).reverse().map(x=>`<div class="event"><span class="dot"></span><span>${x.text}<small>${x.day}일째 · ${x.detail}</small></span></div>`).join(''):`<div class="empty">아직 기록이 없어요.<br>첫 활동을 시작해 볼까요?</div>`;if(state.ending){document.getElementById('quoteTitle').textContent='쁘띠의 꿈이 이루어졌어!';document.getElementById('quote').textContent=`${state.ending.job}의 꿈을 향해 자라난 ${state.name}. 함께 만든 멋진 이야기야!`}else{document.getElementById('quoteTitle').textContent=`${state.name}의 한마디`;document.getElementById('quote').textContent=state.energy<25?'오늘은 잠깐 쉬면서 마음을 돌봐도 좋아.':'새로운 걸 배우면 마음속에 반짝이는 씨앗이 생겨!'}document.getElementById('rest').disabled=!!state.ending}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('rename').onclick=()=>{let n=prompt('쁘띠의 이름을 지어주세요',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,12);save()}};
document.getElementById('rest').onclick=()=>{if(state.energy>=100){toast('에너지가 이미 가득해요!');return}state.energy=Math.min(100,state.energy+30);state.logs.push({text:'포근하게 쉬었어요 ☁️',day:state.days,detail:'에너지 +30'});save();toast('에너지가 회복됐어요!')};
document.getElementById('statsBtn').onclick=()=>{let s=Object.entries(labels).map(([k,v])=>`${v} ${state.stats[k]}`).join(' · ');alert(`${state.name}의 성장 기록\n함께한 날: ${state.days}일\n${s}\n에너지 ${state.energy}/100${state.ending?'\n미래: '+state.ending.job:''}`)};
document.getElementById('reset').onclick=()=>{if(confirm('지금까지의 기록을 지우고 새로 시작할까요?')){state=fresh();save();toast('새로운 이야기가 시작됐어요.')}};
document.getElementById('closeGame').onclick=()=>document.getElementById('overlay').classList.remove('show');
let gameResolved=false;
function openModal(a,desc){gameResolved=false;document.getElementById('gameTitle').textContent=a.icon+' '+a.name;document.getElementById('gameDesc').textContent=desc;document.getElementById('concept').textContent='심리 개념 · '+a.concept;document.getElementById('result').textContent='';document.getElementById('overlay').classList.add('show')}
function finish(a,success=true,bonus={}){if(gameResolved)return;gameResolved=true;let cost=success?10:7;state.energy=Math.max(0,state.energy-cost);let gain=success?8:4;state.stats[a.stat]=Math.min(100,state.stats[a.stat]+gain+(bonus[a.stat]||0));Object.entries(bonus).forEach(([k,v])=>{if(k!==a.stat)state.stats[k]=Math.min(100,state.stats[k]+v)});state.days++;state.logs.push({text:`${a.name} 활동 완료 ${success?'✨':'🌱'}`,day:state.days,detail:`${labels[a.stat]} +${gain}${bonus.body?` · 건강 +${bonus.body}`:''}${bonus.int&&a.stat!=='int'?` · 지능 +${bonus.int}`:''}${bonus.virtue&&a.stat!=='virtue'?` · 인성 +${bonus.virtue}`:''}${bonus.social&&a.stat!=='social'?` · 사회성 +${bonus.social}`:''}`});if(state.days%4===0&&state.age<12)state.age++;if(state.age>=12&&!state.ending){let best=Object.keys(state.stats).sort((x,y)=>state.stats[y]-state.stats[x])[0];let jobs={int:'발명가',virtue:'마음 돌봄 선생님',social:'마을의 리더',body:'탐험가'};state.ending={job:jobs[best],face:Object.keys(state.stats).indexOf(best)}}save();document.getElementById('result').textContent=success?`멋져요! ${labels[a.stat]}이(가) 자랐어요. (+${gain})`:`괜찮아요, 도전한 것만으로도 자랐어요. (+${gain})`;document.getElementById('closeGame').textContent='계속하기'}
function legacyStartGame(id){let a=activities.find(x=>x.id===id);if(state.energy<7){toast('에너지가 부족해요. 먼저 쉬어 주세요.');return}document.getElementById('closeGame').textContent='닫기';let area=document.getElementById('gameArea');
if(id==='memory'){let seq=Array.from({length:3+Math.floor(Math.random()*2)},()=>Math.floor(Math.random()*9)+1);openModal(a,'숫자를 잠깐 기억한 뒤 순서대로 입력해 보세요.');area.innerHTML='<p id="prompt">숫자를 기억해 보세요!</p><div class="game-buttons" id="buttons"></div>';let p=document.getElementById('prompt'),b=document.getElementById('buttons');p.textContent=seq.join('　');setTimeout(()=>{p.textContent='순서대로 눌러 주세요';let idx=0;for(let i=1;i<=9;i++){let x=document.createElement('button');x.className='choice';x.textContent=i;x.onclick=()=>{if(x.disabled)return;if(i!==seq[idx]){document.getElementById('result').textContent='순서가 달랐지만 기억 훈련 완료!';finish(a,false);b.querySelectorAll('button').forEach(q=>q.disabled=true)}else if(++idx===seq.length){document.getElementById('result').textContent='완벽하게 기억했어요!';finish(a,true);window.pmRewardThreeCorrectAnswers?.();b.querySelectorAll('button').forEach(q=>q.disabled=true)}};b.append(x)}},1300)
}else if(id==='stroop'){let colors=['빨강','파랑','초록','노랑'],css=['#d9574f','#5478bd','#56836a','#d2a72d'];let word=Math.floor(Math.random()*4),ink;do{ink=Math.floor(Math.random()*4)}while(ink===word);openModal(a,'글자 뜻에 흔들리지 말고 글자의 색깔을 골라요.');area.innerHTML=`<p style="font-size:32px;font-weight:bold;color:${css[ink]}">${colors[word]}</p><div class="game-buttons">${colors.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join('')}</div>`;area.querySelectorAll('button').forEach(b=>b.onclick=()=>{let ok=+b.dataset.i===ink;finish(a,ok);document.getElementById('result').textContent=ok?'색깔을 잘 찾았어요!':'앗, 글자색을 다시 살펴봐요.'})
}else if(id==='pattern'){let start=Math.floor(Math.random()*4)+1,step=Math.floor(Math.random()*4)+2,ans=start+step*3;openModal(a,'숫자에 숨은 규칙을 찾아 다음 숫자를 골라보세요.');area.innerHTML=`<p style="font-size:19px">${start}　→　${start+step}　→　${start+step*2}　→　?</p><div class="game-buttons">${[ans,ans+1,ans-1,ans+step].sort(()=>Math.random()-.5).map(n=>`<button class="choice" data-v="${n}">${n}</button>`).join('')}</div>`;area.querySelectorAll('button').forEach(b=>b.onclick=()=>{let ok=+b.dataset.v===ans;finish(a,ok);document.getElementById('result').textContent=ok?'규칙을 발견했어요!':'규칙은 같은 수만큼 더하는 거였어요.'})
}else if(id==='patience'){openModal(a,'지금 작은 간식을 받을까요, 잠깐 기다려 더 큰 보상을 받을까요?');area.innerHTML='<p>🍰 지금 간식 하나<br><small>기다리면 간식 두 개!</small></p><div class="game-buttons"><button class="choice" id="now">지금 받을래</button><button class="choice" id="wait">기다려 볼래</button></div>';document.getElementById('now').onclick=()=>{finish(a,false);document.getElementById('result').textContent='솔직한 선택이에요. 다음엔 기다리기도 도전해봐요.'};document.getElementById('wait').onclick=()=>{finish(a,true);document.getElementById('result').textContent='기다림 성공! 간식 두 개를 얻었어요 🍰🍰'}
}else if(id==='emotion'){let scenarios=[['친구가 아끼던 그림을 실수로 구겼어.','속상함','신남','지루함'],['친구가 발표를 앞두고 손을 꼭 쥐고 있어.','긴장','편안함','화남'],['친구가 혼자 앉아 조용히 창밖을 봐.','외로움','자랑스러움','들뜸']];let sc=scenarios[Math.floor(Math.random()*scenarios.length)];openModal(a,'상황을 읽고 친구의 마음을 헤아려 보세요.');area.innerHTML=`<p>${sc[0]}</p><div class="game-buttons">${sc.slice(1).sort(()=>Math.random()-.5).map((x,i)=>`<button class="choice" data-v="${x}">${x}</button>`).join('')}</div>`;area.querySelectorAll('button').forEach(b=>b.onclick=()=>{let ok=b.dataset.v===sc[1];finish(a,ok);document.getElementById('result').textContent=ok?'친구의 마음을 잘 알아차렸어요 💚':'다른 마음일 수도 있어요. 직접 물어봐도 좋겠어요.'})
}else if(id==='breathe'){openModal(a,'천천히 숨을 들이쉬고, 내쉬며 아래 버튼을 눌러요.');area.innerHTML='<p style="font-size:38px" id="breath">🌬️</p><p>화면이 초록색이 될 때 눌러요</p><button class="choice" id="breathBtn">후— 내쉬기</button>';let btn=document.getElementById('breathBtn'),p=document.getElementById('breath'),ready=false;p.style.transition='color 1s';setTimeout(()=>{ready=true;p.textContent='🍃'},900);btn.onclick=()=>{finish(a,ready,{virtue:2});document.getElementById('result').textContent='호흡을 가다듬었어요. 마음이 한결 편안해져요.'}}
else if(id==='share'){openModal(a,'쿠키 6개를 친구 둘과 나눠요. 모두가 공평하다고 느낄까요?');area.innerHTML='<p>🍪 쿠키 여섯 개를 두 친구에게 나눠 주세요</p><div class="game-buttons"><button class="choice" data-v="3,3">3개씩 나누기</button><button class="choice" data-v="5,1">한 명에게 더 주기</button><button class="choice" data-v="4,2">4개와 2개</button></div>';area.querySelectorAll('button').forEach(b=>b.onclick=()=>{let ok=b.dataset.v==='3,3';finish(a,ok);document.getElementById('result').textContent=ok?'공평하게 나눠 모두 기뻐요!':'누구에게 더 필요한지 생각해 보는 것도 좋아요.'})}
else{let target=Math.floor(Math.random()*4);openModal(a,'깜빡이는 발자국이 가리킨 방향을 기억하고 눌러요.');area.innerHTML='<p id="target" style="font-size:28px">준비됐나요?</p><div class="game-buttons"><button class="choice" data-v="0">⬅️ 왼쪽</button><button class="choice" data-v="1">⬆️ 앞</button><button class="choice" data-v="2">➡️ 오른쪽</button><button class="choice" data-v="3">⬇️ 뒤</button></div>';setTimeout(()=>document.getElementById('target').textContent=['⬅️','⬆️','➡️','⬇️'][target],600);area.querySelectorAll('button').forEach(b=>b.onclick=()=>{let ok=+b.dataset.v===target;finish(a,ok,{int:1});document.getElementById('result').textContent=ok?'박자를 잘 맞췄어요!':'괜찮아요, 다시 몸을 움직여 봐요.'})}
}
render();
</script>
<script>
// Revised life simulation: one real hour equals one in-game day.
const petChoices=[['🐣','병아리'],['🐱','고양이'],['🐶','강아지'],['🐹','햄스터/쥐'],['👦','인간 남자'],['👧','인간 여자']];
const targets={veryHigh:88,high:72,mid:55,slightlyLow:42,low:28,veryLow:12};
const jobs=[
['변호사','⚖️',{int:'veryHigh',virtue:'high'}],['판사','⚖️',{int:'veryHigh',virtue:'mid'}],['검사','🔎',{int:'veryHigh'}],['교사','📚',{int:'high',virtue:'veryHigh',social:'veryHigh'}],['의사','🩺',{int:'veryHigh',virtue:'high'}],['한의사','🌿',{int:'veryHigh',virtue:'high',social:'veryHigh'}],['탐정','🕵️',{int:'high',social:'veryHigh'}],['경호원','🛡️',{body:'veryHigh',virtue:'mid'}],['운동선수','🏅',{body:'veryHigh'}],['심리상담사','🛋️',{virtue:'veryHigh',social:'veryHigh'}],['청소부','🧹',{virtue:'high',int:'low'}],['마케터','📣',{social:'veryHigh'}],['7급 공무원','🏛️',{int:'high',social:'high'}],['9급 공무원','🏢',{int:'mid',social:'high'}],['중소기업 주임','💼',{social:'high',int:'slightlyLow'}],['대기업 사원','🏙️',{int:'mid',social:'high'}],['그럭저럭한 회사 인턴','🪪',{int:'slightlyLow',social:'mid'}],['미용사','✂️',{social:'veryHigh',int:'low'}],['코디네이터','👗',{social:'veryHigh',body:'mid'}],['사회복지사','🫶',{social:'veryHigh',virtue:'veryHigh',int:'mid'}],['해커','💻',{int:'veryHigh',virtue:'low',social:'veryLow',body:'low'}],['연구원','🔬',{int:'veryHigh',virtue:'mid',social:'low',body:'veryLow'}],['재벌3세의 애인','💎',{int:'low',social:'veryHigh'}],['화가','🎨',{body:'mid',social:'mid',virtue:'mid'}],['가수','🎤',{social:'high',virtue:'high',body:'high'}],['안무가','💃',{body:'veryHigh',social:'high'}],['택시기사','🚕',{social:'veryHigh',int:'mid'}],['바리스타','☕',{social:'high',int:'slightlyLow'}],['카페 사장','🧋',{social:'high',int:'mid',body:'mid'}],['작가','✍️',{int:'high',social:'mid',body:'low'}],['엔터테인먼트 매니저','🎬',{body:'high',social:'veryHigh',virtue:'mid'}],['농부','🌾',{body:'veryHigh',virtue:'high',social:'mid',int:'mid'}],['분식집 사장','🍢',{social:'high',virtue:'veryHigh',body:'mid'}],['길거리 붕어빵 판매원','🐟',{int:'low',body:'high',social:'high'}],['핸드폰 판매원','📱',{social:'veryHigh',int:'slightlyLow'}]
];
function careerFit(j){let pairs=Object.entries(j[2]);return pairs.reduce((s,[k,l])=>s+Math.max(0,100-Math.abs((state.stats[k]||0)-targets[l])),0)/pairs.length}
function saveV2(){state.lastTick=Date.now();localStorage.setItem('petitMindSave',JSON.stringify(state))}
function setupPet(){let chosen=petChoices[0];document.getElementById('overlay').classList.add('show');document.getElementById('gameTitle').textContent='나만의 쁘띠 만들기';document.getElementById('gameDesc').textContent='함께 성장할 친구의 모습과 이름을 골라 주세요.';document.getElementById('concept').textContent='';document.getElementById('result').textContent='';document.getElementById('gameArea').innerHTML=`<div style="width:100%"><div class="pet-options">${petChoices.map((p,i)=>`<button class="pet-pick ${i===0?'selected':''}" data-i="${i}"><span>${p[0]}</span>${p[1]}</button>`).join('')}</div><input class="name-input" id="firstName" maxlength="12" placeholder="쁘띠의 이름" value="몽글이"></div>`;document.querySelectorAll('.pet-pick').forEach(b=>b.onclick=()=>{chosen=petChoices[+b.dataset.i];document.querySelectorAll('.pet-pick').forEach(x=>x.classList.toggle('selected',x===b))});document.getElementById('closeGame').textContent='함께 시작하기';document.getElementById('closeGame').onclick=()=>{let n=document.getElementById('firstName').value.trim();if(!n){toast('이름을 입력해 주세요.');return}state.name=n;state.species=chosen[0];state.kind=chosen[1];state.gameHours=0;state.days=0;state.age=0;state.energy=50;state.stats={int:0,virtue:0,social:0,body:0};state.logs=[];state.lastTick=Date.now();saveV2();document.getElementById('overlay').classList.remove('show');document.getElementById('closeGame').onclick=()=>document.getElementById('overlay').classList.remove('show');drawV2()}}
function recommended(){if(!state.recommendationCount){let r=Math.random();state.recommendationCount=r<.01?5:r<.03?4:3;saveV2()}return jobs.map(j=>{let score=careerFit(j);if((state.lowCareHours||0)>20&&['해커','연구원'].includes(j[0]))score+=Math.min(18,(state.lowCareHours-(state.highCareHours||0))*.25);if((state.highCareHours||0)>20&&['운동선수','경호원','가수','엔터테인먼트 매니저','탐정'].includes(j[0]))score+=Math.min(18,(state.highCareHours-(state.lowCareHours||0))*.25);return {job:j,score}}).sort((a,b)=>b.score-a.score).slice(0,state.recommendationCount)}
function finishCareer(job){state.ending={job:job[0],icon:job[1],costume:({변호사:'👔⚖️',판사:'👘⚖️',검사:'👔🔎',교사:'🧑‍🏫📚',의사:'🥼🩺',한의사:'🥼🌿',탐정:'🧥🕵️',경호원:'🕶️🛡️',운동선수:'🎽🏅',심리상담사:'🧥🛋️',청소부:'🧤🧹',마케터:'👔📣','7급 공무원':'👔🏛️','9급 공무원':'👔🏢',미용사:'💇✂️',코디네이터:'🧢👗',사회복지사:'🧥🫶',해커:'🧢💻',연구원:'🥼🔬',가수:'✨🎤',안무가:'🎽💃',택시기사:'🧢🚕',바리스타:'🧑‍🍳☕',작가:'🧣✍️',농부:'👒🌾'}[job[0]]||`${job[1]}👔`)};saveV2();document.getElementById('overlay').classList.remove('show');drawV2()}
function offerJobs(){if(state.age<20||state.ending||!state.species||window.careerModalOpen)return;window.careerModalOpen=true;let list=recommended(),selected=list[0].job;document.getElementById('overlay').classList.add('show');document.getElementById('gameTitle').textContent='스무 살, 나의 첫 직업';document.getElementById('gameDesc').textContent=`${state.name}의 스탯과 어울리는 직업을 추천해요. 직접 하나를 골라 주세요.`;document.getElementById('concept').textContent='직업에 맞는 코스튬도 함께 장착해요';document.getElementById('result').textContent='';document.getElementById('gameArea').innerHTML=`<div class="job-list">${list.map((x,i)=>`<button class="job-pick ${i===0?'selected':''}" data-i="${i}"><b>${i+1}. ${x.job[1]} ${x.job[0]}</b><small>적합도 ${Math.round(x.score)} · ${Object.entries(x.job[2]).map(([k,v])=>labels[k]+' '+({veryHigh:'매우 높음',high:'높음',mid:'보통',slightlyLow:'살짝 낮음',low:'낮음',veryLow:'매우 낮음'}[v])).join(' · ')}</small></button>`).join('')}</div>`;document.querySelectorAll('.job-pick').forEach(b=>b.onclick=()=>{selected=list[+b.dataset.i].job;document.querySelectorAll('.job-pick').forEach(x=>x.classList.toggle('selected',x===b))});document.getElementById('closeGame').textContent='이 직업으로 결정';document.getElementById('closeGame').onclick=()=>{window.careerModalOpen=false;finishCareer(selected)}}
function drawV2(){if(!state.species){setupPet();return}let stage=Math.min(3,Math.floor(state.age/5));document.getElementById('charName').textContent=state.name;document.getElementById('age').textContent=`${['아기','어린이','청소년','청년'][stage]} · ${state.age}살`;let forms=({'🐣':['🐣','🐥','🐔','🐔'],'🐱':['🐱','🐱','🐈','🐈'],'🐶':['🐶','🐶','🐕','🐕'],'🐹':['🐹','🐹','🐹','🐹'],'👦':['👶🏻','🧒🏻','👦🏻','🧑🏻'],'👧':['👶🏻','🧒🏻','👧🏻','👩🏻']})[state.species]||[state.species,state.species,state.species,state.species];document.getElementById('sprite').textContent=state.ending?`${forms[stage]} ${state.ending.costume}`:forms[stage];document.getElementById('sprite').style.fontSize=state.ending?'58px':(['88px','92px','96px','100px'][stage]);document.getElementById('mood').textContent=state.ending?`꿈을 이룬 ${state.ending.job}`:`게임 속 ${state.days+1}일째 · ${state.age}살`;document.getElementById('meters').innerHTML=Object.keys(labels).map(k=>`<div class="meter"><div class="meter-head"><span>${icons[k]} ${labels[k]}</span><b>${state.stats[k]}</b></div><div class="track"><div class="fill" style="width:${state.stats[k]}%"></div></div></div>`).join('');document.getElementById('energyText').textContent=`${state.energy} / 100`;document.getElementById('energyBar').style.width=state.energy+'%';document.getElementById('dayCount').textContent=`${state.days+1}일째`;document.getElementById('gameDate').textContent=`${state.days+1}일째`;let toYear=365-(state.gameHours%365);document.getElementById('nextYear').textContent=`${Math.floor(toYear)}시간 ${Math.floor(toYear%1*60)}분`;document.getElementById('activities').innerHTML=activities.filter(a=>(state.unlockedGames||['patience']).includes(a.id)).map(a=>`<button class="activity" data-game="${a.id}" ${state.ending||state.age>=20?'disabled':''}><span class="emoji">${a.icon}</span><span><b>${a.name}</b><small>${a.hint}</small></span></button>`).join('');document.querySelectorAll('.activity').forEach(b=>b.onclick=()=>startGame(b.dataset.game));document.getElementById('quoteTitle').textContent=state.ending?`${state.name} · ${state.ending.job}`:`${state.name}의 한마디`;if(!document.getElementById('quote').dataset.rotating)document.getElementById('quote').textContent=state.ending?`${state.ending.costume} 직업 코스튬을 갖춰 입고 새로운 하루를 시작해요!`:state.age>=20?'성인이 되었어요! 추천 직업 중 하나를 선택해 주세요.':'한 시간이 지나면 하루, 365일이 지나면 한 살 자라요.';document.getElementById('rest').disabled=!!state.ending||!!window.restTimer;if(!window.restTimer)document.getElementById('rest').textContent='☁️ 쉬어가기';document.getElementById('rename').disabled=!!state.ending;document.getElementById('timeline').innerHTML=state.logs.slice(-5).reverse().map(x=>`<div class="event"><span class="dot"></span><span>${x.text}<small>${x.day}일째 · ${x.detail}</small></span></div>`).join('')||'<div class="empty">성장 기록이 여기에 쌓여요.</div>';if(state.age>=20&&!state.ending)setTimeout(offerJobs,250)}
function finish(a,success=true){if(gameResolved)return;gameResolved=true;if(success)state.stats[a.stat]=Math.min(100,state.stats[a.stat]+1);state.energy=Math.max(0,state.energy-(success?5:3));state.logs.push({text:`${a.name} ${success?'성공 ✨':'도전 완료 🌱'}`,day:state.days+1,detail:success?`${labels[a.stat]} +1`:'스탯 변화 없음'});saveV2();drawV2();document.getElementById('result').textContent=success?`성공! ${labels[a.stat]} +1`:'도전했어요! 성공하면 스탯이 1 올라요.';document.getElementById('closeGame').textContent='계속하기';document.getElementById('closeGame').onclick=()=>document.getElementById('overlay').classList.remove('show')}
function openModal(a,desc){gameResolved=false;let scenes=['비 오는 방과 후, 친구가 조용히 다가왔어요.','햇살 가득한 운동장에 작은 사건이 생겼어요.','축제 준비 중 생각지 못한 문제가 나타났어요.','낯선 마을에서 새로운 친구를 만났어요.','소풍 가는 길, 모두의 도움이 필요해졌어요.','도서관에서 집중력을 시험할 순간이에요.','바닷가에서 길 잃은 강아지를 발견했어요.','눈 내리는 날, 따뜻한 마음이 필요한 상황이에요.'];let bgs=['linear-gradient(135deg,#f5edcf,#d8e9da)','linear-gradient(135deg,#e2eafa,#f6e4d2)','linear-gradient(135deg,#f4e0e1,#e2eddb)','linear-gradient(135deg,#e3e9f5,#f5efcf)'];document.getElementById('gameTitle').textContent=a.icon+' '+a.name;document.getElementById('gameDesc').textContent=scenes[Math.floor(Math.random()*scenes.length)]+' '+desc;document.getElementById('concept').textContent='심리 개념 · '+a.concept;document.getElementById('result').textContent='';document.getElementById('gameArea').style.background=bgs[Math.floor(Math.random()*bgs.length)];document.getElementById('overlay').classList.add('show')}
document.getElementById('rest').onclick=()=>{if(window.restTimer)return;if(state.energy>=100){toast('컨디션이 이미 가득해요!');return}let btn=document.getElementById('rest'),left=10;btn.disabled=true;btn.textContent=`☁️ 쉬는 중 ${left}초`;window.restTimer=setInterval(()=>{left--;btn.textContent=`☁️ 쉬는 중 ${left}초`;if(left<=0){clearInterval(window.restTimer);window.restTimer=null;state.energy=Math.min(100,state.energy+5);state.logs.push({text:'10초 푹 쉬었어요 ☁️',day:state.days+1,detail:'컨디션 +5'});saveV2();drawV2();toast('컨디션이 5 회복됐어요!')}},1000)};
document.getElementById('reset').onclick=()=>{if(confirm('기록을 지우고 새 쁘띠를 선택할까요?')){localStorage.removeItem('petitMindSave');location.reload()}};
document.getElementById('statsBtn').onclick=()=>alert(`${state.name} · ${state.age}살 · 게임 속 ${state.days+1}일째\n지능 ${state.stats.int} · 인성 ${state.stats.virtue} · 사회성 ${state.stats.social} · 건강 ${state.stats.body}\n컨디션 ${state.energy}/100${state.ending?'\n직업: '+state.ending.job:''}`);
document.getElementById('rename').onclick=()=>{let n=prompt('쁘띠의 이름',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,12);saveV2();drawV2()}};
function tickV2(){let now=Date.now(),elapsed=Math.max(0,now-(state.lastTick||now));state.lastTick=now;if(!state.species){saveV2();return}state.gameHours=(state.gameHours||0)+elapsed/3600000;if(state.energy<=30)state.lowCareHours=(state.lowCareHours||0)+elapsed/3600000;if(state.energy>=90)state.highCareHours=(state.highCareHours||0)+elapsed/3600000;state.days=Math.floor(state.gameHours);let newAge=Math.min(20,Math.floor(state.gameHours/365));if(newAge!==state.age){state.age=newAge;state.logs.push({text:`${newAge}살이 되었어요 🎂`,day:state.days+1,detail:'성장 단계가 바뀌었어요'});toast(`${state.name} ${newAge}살!`)}saveV2();drawV2()}
try{state=JSON.parse(localStorage.getItem('petitMindSave'))||null}catch{state=null}if(!state||!state.species){state={name:'',species:null,kind:null,age:0,days:0,gameHours:0,lastTick:Date.now(),energy:50,stats:{int:0,virtue:0,social:0,body:0},logs:[],ending:null}}else{state.gameHours=state.gameHours||0;state.stats={int:0,virtue:0,social:0,body:0,...state.stats};state.age=Math.min(20,Math.floor(state.gameHours/365));state.days=Math.floor(state.gameHours);state.lastTick=state.lastTick||Date.now()}window.pmObsoleteClock=setInterval(tickV2,1000);drawV2();
</script>

function pmRenderDiaryPage(){let pages=window.diaryPages||[],idx=window.diaryPageIndex||0,day=pages[idx]||1,entries=(state.logs||[]).filter(x=>(Number(x.day)||state.days+1)===day),ageAtDay=Math.min(25,Math.max(1,(state.age||1)-(state.days+1-day)));document.getElementById('diaryPageTitle').textContent='키운 지 '+day+'일째 · '+(state.name||'쁘띠')+' '+ageAtDay+'세';let area=document.getElementById('diaryPageEntries');area.replaceChildren();if(!entries.length){let empty=document.createElement('div');empty.className='diary-empty';empty.textContent='이날은 아직 기록이 없어요. 쁘띠와 보낸 하루를 메모로 남겨보세요.';area.append(empty)}else entries.forEach(x=>{let row=document.createElement('div');row.className='diary-row';row.textContent=x.text||'성장 기록';let small=document.createElement('small');small.textContent=x.detail||'쁘띠와 함께한 하루';row.append(small);area.append(row)});let history={int:0,virtue:0,social:0,body:0};(state.logs||[]).filter(x=>(Number(x.day)||state.days+1)<=day).forEach(x=>{for(let k of Object.keys(history))if((x.detail||'').includes(labels[k]+' +1'))history[k]=Math.min(100,history[k]+1)});let summary=document.getElementById('diarySummary');summary.innerHTML=[['지능',history.int],['인성',history.virtue],['사회성',history.social],['건강',history.body]].map(x=>'<div class="diary-stat">'+x[0]+'<b>'+x[1]+'/100</b></div>').join('');let memos=state.diaryMemos||{};document.getElementById('diaryMemo').value=memos[String(day)]||(day===state.days+1?state.diaryMemo||'':'');document.getElementById('diaryPageCount').textContent=(idx+1)+' / '+pages.length+' 페이지';document.getElementById('diaryPrev').disabled=idx<=0;document.getElementById('diaryNext').disabled=idx>=pages.length-1}

function pmCareerOutcome(job){let name=state.name||'쁘띠',batchim=((name.charCodeAt(name.length-1)-0xAC00)%28)!==0,subject=name+(batchim?'은':'는');if(['가수','운동선수','화가','작가','안무가'].includes(job))return `${subject} ${job}의 꿈을 이뤄냈습니다!`;return `${subject} ${job}로 성장했습니다!`}

function offerJobs(){if(!state.careerReady||state.ending||window.careerModalOpen||!window.pmCareerRequested)return;window.pmCareerRequested=false;window.careerModalOpen=true;let ranked=recommended(),list=ranked.map(x=>x.job),selected=list[0]||jobs[0],overlay=document.getElementById('overlay'),area=document.getElementById('gameArea');document.getElementById('gameTitle').textContent='나의 미래 직업 고르기';document.getElementById('gameDesc').textContent=`${state.name}의 스탯과 성장 기록을 바탕으로 추천한 직업이에요.`;document.getElementById('concept').textContent='직업을 고르면 쁘띠의 이야기가 완성돼요';document.getElementById('result').textContent='';area.innerHTML=`<div class="job-list">${list.map((j,i)=>`<button class="job-pick ${i===0?'selected':''}" data-job="${i}"><b>${j[1]} ${j[0]}</b><small>성장 스탯에 맞춘 추천 직업</small></button>`).join('')}<button class="job-pick" id="chooseUnemployed"><b>🧍 백수로 지내기</b><small>이후 나이가 들수록 스탯이 해마다 20씩 줄어들어요.</small></button></div>`;area.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{selected=list[+b.dataset.job];area.querySelectorAll('.job-pick').forEach(x=>x.classList.toggle('selected',x===b))});let u=document.getElementById('chooseUnemployed');u.onclick=()=>{selected=['백수','🧍',{}];area.querySelectorAll('.job-pick').forEach(x=>x.classList.toggle('selected',x===u))};document.getElementById('closeGame').textContent='이 직업으로 결정';document.getElementById('closeGame').onclick=()=>{window.careerModalOpen=false;if(selected[0]==='백수'){state.occupation='백수';state.unemployed=true;state.logs.push({text:`${state.name}은/는 백수로 살기로 했어요.`,day:state.days+1,detail:'나이가 들수록 모든 스탯이 감소합니다.'});saveV2();drawV2();overlay.classList.remove('show')}else finishCareer(selected)}}
function finishCareer(job){let pick=Array.isArray(job)?job:jobs.find(j=>j[0]===job)||[String(job),'🎓',{}];window.careerModalOpen=false;if(pick[0]==='백수'){state.occupation='백수';state.unemployed=true;saveV2();drawV2();document.getElementById('overlay').classList.remove('show');return}pmShowEnding(pick)}
function pmEndDay(){state.days=(state.days||0)+1;state.playsToday=0;let next=unlockNextByWeakest();if(next){state.age=Math.min(25,(state.age||1)+1);state.unlockedThroughAge=state.age;state.logs.push({text:`새 미니게임 해방: ${next.name} 🎮`,day:state.days+1,detail:`${labels[next.stat]} 스탯과 연결된 활동 · 나이 ${state.age}세`});toast(`${next.name} 해방 · ${state.age}세!`)}else if(state.age<25){state.age=(state.age||1)+1;state.unlockedThroughAge=state.age}else if(state.careerReady){state.age=(state.age||25)+1;if(state.occupation==='백수'||state.unemployed){state.occupation='백수';state.unemployed=true;for(let k of Object.keys(state.stats))state.stats[k]=Math.max(0,(state.stats[k]||0)-20);state.logs.push({text:'백수 생활이 이어졌어요.',day:state.days+1,detail:'모든 스탯 −20'})}if(state.age>=40&&state.occupation==='백수'){pmShowDeath();return}}if(state.unlockedGames.length>=activities.length&&state.lastGameRuns>=3&&!state.careerReady){state.careerReady=true;state.occupation=state.occupation||'백수';state.unemployed=state.occupation==='백수';state.logs.push({text:'모든 미니게임을 열고 마지막 게임을 세 번 완료했어요.',day:state.days+1,detail:'직업을 선택할 수 있어요.'});toast('직업 선택이 열렸어요!')}saveV2();drawV2();pmRefreshHud()}
function finish(a,success=true){if(gameResolved)return;gameResolved=true;state.activityPlays=(state.activityPlays||0)+1;state.playsToday=(state.playsToday||0)+1;state.activityUses=state.activityUses||{};state.activityUses[a.id]=(state.activityUses[a.id]||0)+1;if(success)state.stats[a.stat]=Math.min(100,(state.stats[a.stat]||0)+1);state.energy=Math.max(0,state.energy-(success?5:3));let lastId=state.unlockedGames[state.unlockedGames.length-1];if(state.unlockedGames.length>=activities.length&&a.id===lastId)state.lastGameRuns=(state.lastGameRuns||0)+1;state.logs.push({text:`${a.name} ${success?'성공 ✨':'도전 완료 🌱'}`,day:state.days+1,detail:`${success?`${labels[a.stat]} +1`:'스탯 변화 없음'} · 오늘 ${state.playsToday}/3번째 활동`});if(state.playsToday>=3)pmEndDay();else{saveV2();drawV2();pmRefreshHud()}document.getElementById('result').textContent=success?`성공! ${labels[a.stat]} +1`:'도전했어요! 이번에는 스탯이 오르지 않았어요.';document.getElementById('closeGame').textContent='계속하기';document.getElementById('closeGame').onclick=()=>document.getElementById('overlay').classList.remove('show')}
